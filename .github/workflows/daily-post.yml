name: Daily Fortune Post

on:
  # 自動スケジュール実行は停止しています。daily-postが新しい日付のコンテンツを
  # 生成すると、前日分のtweet_id・お悩みテーマが上書きされてしまい、前日投稿への
  # 返信が二度と自動応答できなくなるため。前日の会話が落ち着いたのを確認してから、
  # Actionsタブで手動実行(workflow_dispatch)してください。
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ai_fortune_system
        run: pip install -r requirements.txt

      - name: Generate and publish today's fortune
        working-directory: ai_fortune_system
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          AUTO_POST_TO_X: 'false'
        run: python -c "from main import run_daily_fortune_job; run_daily_fortune_job()"

      - name: Commit updated state
        working-directory: ai_fortune_system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p state
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Update daily fortune state [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
