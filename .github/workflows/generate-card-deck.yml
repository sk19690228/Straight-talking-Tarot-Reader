name: Generate Card Deck (Gemini)

on:
  workflow_dispatch:
    inputs:
      cards:
        description: '再生成したいカードのスラッグ(スペース区切り、例: the_tower the_devil)。空欄なら大アルカナ22枚すべて。'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ai_fortune_system
        run: pip install -r requirements.txt

      - name: Generate tarot card deck via Gemini
        working-directory: ai_fortune_system
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/generate_card_deck_gemini.py ${{ inputs.cards }}

      - name: Commit generated card images
        working-directory: ai_fortune_system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/templates/
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate tarot card deck via Gemini image generation [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
